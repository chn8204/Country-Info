<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e3c72">

<title>Country Information API</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

<h1>🌍 Country Information</h1>

<p>
Search for a country to explore its capital, population, and region.
</p>

<form id="searchForm">
<label for="countryInput">Country name</label>
<input
type="search"
id="countryInput"
placeholder="e.g. Japan or Brazil"
autocomplete="off"
required
>

<button type="submit">
Search Country
</button>
</form>

<section id="result" aria-live="polite" aria-atomic="true">
<p>Search for a country to see information.</p>
</section>

</main>

<script src="app.js"></script>

</body>
</html>
